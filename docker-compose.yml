services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: cupom-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-cupom}
      DB_USERNAME: ${DB_USERNAME:-cupom}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    container_name: cupom-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:18-alpine
    container_name: cupom-db
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cupom}
      POSTGRES_USER: ${DB_USERNAME:-cupom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phppgadmin:
    image: snimshchikov/phppgadmin:latest
    container_name: cupom-phppgadmin
    restart: unless-stopped
    ports:
      - "${PHPPGADMIN_PORT:-8080}:80"
    environment:
      PPA_SERVER_DESC: Cupom
      PPA_SERVER_HOST: db
      PPA_SERVER_PORT: "5432"
      PPA_SERVER_SSL_MODE: disable
      PPA_SERVER_DEFAULT_DB: ${DB_DATABASE:-cupom}
      PPA_EXTRA_LOGIN_SECURITY: "false"
      PPA_DEFAULT_LANG: auto
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
